[package]
name = "hyotan-image-estimate-check"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[[bin]]
name = "hyotan-image-estimate-check"
path = "main.rs"

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "=0.22.1"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
