edition = "2024"
license = "Apache-2.0"
publish = false
[dependencies]
hyotan-turn-lease = { path = "../TurnLease" }
hyotan-operation-harness = { path = "../OperationHarness" }
hyotan-appserver-operation-harness = { path = "../AppServerOperationHarness" }
