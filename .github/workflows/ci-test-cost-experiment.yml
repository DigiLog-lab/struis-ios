name: CI test cost experiment
run-name: Paired UI test cost experiment

on:
  push:
    branches: [experiment/ci-test-cost-20261021]
    paths:
      - .github/workflows/ci-test-cost-experiment.yml
      - scripts/ci/benchmark_ui_cost.py
      - strius/Runtime/MockTurnRunner.swift
      - strius/State/LedgerFixtures.swift
      - striusTests/Ledger/CIBenchmarkFixtureTests.swift
      - striusUITests/ReplyTailUITests.swift
      - striusUITests/WorkbookSplitGradingUITests.swift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-test-cost-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired:
    runs-on: xcode-27
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record environment
        run: |
          sudo mdutil -a -i off >/dev/null 2>&1 || true
          xcodebuild -version
          sw_vers
          sysctl hw.ncpu hw.memsize
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Restore identical native inputs
        id: native
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            NativeRuntime/Vendor
            NativeRuntime/PythonPackages
            NativeRuntime/PackageCache
            NativeRuntime/.build
          key: native-runtime-v1-${{ hashFiles('NativeRuntime/**', '!NativeRuntime/Shared/**', '!NativeRuntime/Worker/*.swift', '!NativeRuntime/Worker/Info.plist', '!NativeRuntime/**/*.entitlements', '!NativeRuntime/**/*.md') }}
      - name: Use published native outputs on cache miss
        if: steps.native.outputs.cache-hit != 'true'
        run: python3 scripts/ci/native_prebuilt.py apply
      - name: Build once and warm Simulator
        timeout-minutes: 35
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-cost-benchmark"
          started=$(date +%s)
          xcodebuild build-for-testing -project strius.xcodeproj -scheme strius \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" ARCHS=arm64 STRUIS_AUTH_REQUIRED=YES \
            > "$RUNNER_TEMP/ci-cost-benchmark/build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/ci-cost-benchmark/build.log"; exit 1; }
          echo "BUILD_SECONDS=$(( $(date +%s) - started ))" | tee "$RUNNER_TEMP/ci-cost-benchmark/build-time.txt"
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((key for key in runtimes if ".iOS-" in key),
                       key=lambda key: [int(part) for part in key.rsplit(".iOS-", 1)[1].split("-")])
          for key in reversed(ios):
              for device in runtimes[key]:
                  if device["name"] == "iPhone 17":
                      print(device["udid"]); sys.exit()
          sys.exit("iPhone 17 not found")')
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/strius.app"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" "$bundle"
          data=$(xcrun simctl get_app_container "$udid" "$bundle" data)
          ready=false
          for _ in $(seq 1 240); do
            if [ -d "$data/Library/Application Support/Struis" ]; then ready=true; break; fi
            sleep 1
          done
          $ready || { echo 'Warm-up did not initialize learner data'; exit 1; }
          sleep 5
          xcrun simctl terminate "$udid" "$bundle" || true
      - name: Unit tests and paired UI measurements
        timeout-minutes: 45
        run: python3 scripts/ci/benchmark_ui_cost.py
      - name: Memory after experiment
        if: always()
        run: |
          sysctl vm.swapusage || true
          vm_stat || true
      - name: Save raw measurements and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-cost-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-cost-benchmark
          if-no-files-found: warn
          retention-days: 7
