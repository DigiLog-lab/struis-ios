name: Issue agent
run-name: >-
  ${{ github.event_name == 'push' && 'Refresh agent PRs after main moved' ||
      github.event_name == 'issues' && github.event.action == 'closed' && format('Cleanup #{0}', github.event.issue.number) ||
      format('Issue agent #{0}', github.event.issue.number || inputs.issue || github.event.client_payload.issue) }}

# Issues labeled `agent` are conversations with Claude Code. Each comment from an allowed person
# starts a new session that is shown the Issue thread; nothing is checkpointed or restarted on its
# own. `agentctl ready` sends a PR's verified HEAD to ios.yml (`Verify PR #<n> <sha>`); that run calls
# this workflow at its end (workflow_call, `report` only) to write the commit status `Struis / verify`
# and wake the Issue when it is red. A workflow_run trigger cannot be used for that: a run started
# with GITHUB_TOKEN (the agent's repository_dispatch) never triggers workflow_run (Issue #68).
# When main moves, `refresh` brings the agent PRs waiting for review up to date and verifies them again.
# The store (cloudflare/agent) accepts jobs of this workflow file, also when it is called from ios.yml,
# so every job that reads or writes the Issue's state lives here.
on:
  # Only from ios.yml's PR verification, with the result of its jobs.
  workflow_call:
    inputs:
      verify_conclusion:
        description: success / failure / cancelled
        type: string
        required: true
      ui_tier:
        description: pr / cosmetic(見た目だけ)
        type: string
        required: false
  workflow_dispatch:
    inputs:
      issue:
        description: 実行するIssue番号
        required: true
        type: string
  # Sent with only contents: write (agentlib.dispatch): verify_report.py wakes an Issue after a red verification.
  repository_dispatch:
    types: [agent-issue]
  issues:
    types: [opened, labeled, closed]
  issue_comment:
    types: [created]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per Issue for workers; reports and cleanups never wait on a worker.
  group: >-
    ${{ inputs.verify_conclusion && format('agent-report-{0}', github.run_id) ||
        github.event_name == 'push' && 'agent-refresh' ||
        github.event_name == 'issues' && github.event.action == 'closed' && format('agent-cleanup-{0}', github.event.issue.number) ||
        format('agent-issue-{0}', github.event.issue.number || inputs.issue || github.event.client_payload.issue) }}
  cancel-in-progress: false

env:
  AGENT_STORE_URL: ${{ vars.AGENT_STORE_URL || 'https://agent-struis.digiloglab.com' }}
  AGENT_DERIVED_DATA: ${{ github.workspace }}/../agent-derived-data
  AGENT_LABEL: ${{ vars.AGENT_LABEL || 'agent' }}
  AGENT_ALLOWED_USERS: ${{ vars.AGENT_ALLOWED_USERS }}
  ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue || github.event.client_payload.issue }}

jobs:
  route:
    if: >-
      !inputs.verify_conclusion && (
      github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' ||
      (contains(fromJSON('["issues", "issue_comment"]'), github.event_name) && github.event.action != 'closed' &&
      !github.event.issue.pull_request && contains(github.event.issue.labels.*.name, vars.AGENT_LABEL || 'agent') &&
      (github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      id-token: write
    outputs:
      run: ${{ steps.route.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/agent
      - name: 未処理の指示を確認
        id: route
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/agent/agentctl.py route

  worker:
    needs: route
    if: needs.route.outputs.run == 'true'
    runs-on: xcode-27
    timeout-minutes: 340
    # No actions: write and no statuses: write: the agent cannot change the runs, artifacts or the
    # commit status that decide a merge. It starts workflows with repository_dispatch (contents: write).
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: エージェント用ツールを固定
        run: cp -R scripts/agent "$RUNNER_TEMP/agent-tools"
      - name: native runtime cacheを復元
        id: native
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            NativeRuntime/Vendor
            NativeRuntime/PythonPackages
            NativeRuntime/PackageCache
            NativeRuntime/.build
          key: native-runtime-v1-${{ hashFiles('NativeRuntime/**', '!NativeRuntime/Shared/**', '!NativeRuntime/Worker/*.swift', '!NativeRuntime/Worker/Info.plist', '!NativeRuntime/**/*.entitlements', '!NativeRuntime/**/*.md') }}
          restore-keys: native-runtime-v1-
      - name: 作業ブランチを準備し、mainを取り込む
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_HOME: ${{ runner.temp }}/agent
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_EFFORT: ${{ vars.AGENT_EFFORT }}
          NATIVE_CACHE_HIT: ${{ steps.native.outputs.cache-hit }}
          NATIVE_CACHE_KEY: ${{ steps.native.outputs.cache-matched-key }}
        run: python3 "$RUNNER_TEMP/agent-tools/agentctl.py" prepare
      # The native part of the key is the native cache's own key, computed before that cache was restored.
      # hashFiles('NativeRuntime/**') here would also read the restored Vendor/.build trees and fails.
      - name: ブランチのDerivedDataを復元
        if: steps.prepare.outputs.skip == 'false'
        id: derived
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AGENT_DERIVED_DATA }}
          key: ${{ steps.prepare.outputs.derived_cache_prefix }}${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.xcode_cache_id }}-${{ steps.native.outputs.cache-primary-key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.prepare.outputs.derived_cache_prefix }}${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.xcode_cache_id }}-${{ steps.native.outputs.cache-primary-key }}-
      - name: 実行状態の監視を開始
        if: steps.prepare.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_HOME: ${{ runner.temp }}/agent
          RUNNER_TRACKING_ID: ''
        run: |
          nohup python3 "$RUNNER_TEMP/agent-tools/progress.py" > "$AGENT_HOME/artifacts/progress.log" 2>&1 &
      - name: Claudeの逐次ログを設定
        if: steps.prepare.outputs.skip == 'false'
        run: python3 "$RUNNER_TEMP/agent-tools/configure_logging.py"
      - name: Claude Code
        id: claude
        timeout-minutes: 300
        if: steps.prepare.outputs.skip == 'false'
        continue-on-error: true
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        env:
          APPEND_SYSTEM_PROMPT: ${{ steps.prepare.outputs.system_prompt }}
          CLAUDE_CODE_PROMPT_CACHE_TTL: 1h
          DISABLE_AUTOUPDATER: '1'
          AGENT_HOME: ${{ runner.temp }}/agent
          AGENT_CTL: ${{ runner.temp }}/agent-tools/agentctl.py
          # 実AIテスト専用。キーはDEBUG Simulatorへ一時ファイル経由で渡す
          STRUIS_TEST_ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_AGENT_API_KEY }}
          STRUIS_DELIVERY_APP_KEY: ${{ secrets.STRUIS_DELIVERY_APP_KEY }}
        with:
          show_full_output: "false"
          display_report: "false"
          allowed_bots: "github-actions[bot]"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prepare.outputs.prompt }}
          claude_args: ${{ steps.prepare.outputs.claude_args }}
      # The secrets are given here only to be found and replaced in the run's records (public artifact).
      - name: 返信と記録
        if: always() && steps.prepare.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_HOME: ${{ runner.temp }}/agent
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          REDACT_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REDACT_CLAUDE_AGENT_API_KEY: ${{ secrets.CLAUDE_AGENT_API_KEY }}
          REDACT_STRUIS_DELIVERY_APP_KEY: ${{ secrets.STRUIS_DELIVERY_APP_KEY }}
        run: python3 "$RUNNER_TEMP/agent-tools/agentctl.py" finalize
      - name: ブランチのDerivedDataを保存
        if: always() && steps.prepare.outputs.skip == 'false'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AGENT_DERIVED_DATA }}
          key: ${{ steps.derived.outputs.cache-primary-key }}
      - name: 記録を保存
        if: always() && steps.prepare.outputs.skip == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-issue-${{ env.ISSUE_NUMBER }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent/artifacts
          if-no-files-found: ignore
          retention-days: 14

  # The end of a `Verify PR #<n> <sha>` run of ios.yml (called from there): the commit status, and a
  # wake-up when red. Runs main's code only; no checkout of the PR.
  report:
    if: inputs.verify_conclusion != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: write
      issues: write
      pull-requests: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/agent
      - name: 検証の結果をPRとIssueへ返す
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERIFY_CONCLUSION: ${{ inputs.verify_conclusion }}
          VERIFY_TIER: ${{ inputs.ui_tier }}
        run: python3 scripts/agent/verify_report.py

  # main moved (a merge): every agent PR waiting for review takes main and is verified again.
  refresh:
    if: github.event_name == 'push' && !inputs.verify_conclusion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/agent
      - name: レビュー待ちのPRに最新のmainを取り込み、検証し直す。閉じたIssueの作業ブランチを消す
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/agent/refresh.py

  cleanup:
    if: >-
      !inputs.verify_conclusion && github.event_name == 'issues' && github.event.action == 'closed' &&
      contains(github.event.issue.labels.*.name, vars.AGENT_LABEL || 'agent')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/agent
      - name: 閉じたIssueのDerivedData cache、作業ブランチ、受け渡し用ブランチを削除
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/agent/cleanup.py
