name: Probe Xcode Cloud
# Read-only: lists the Xcode Cloud products, workflows and recent build runs (with action durations)
# through the App Store Connect API, to decide which CI work can move to Xcode Cloud. Prints no secrets.
on:
  push:
    branches: [probe/xcode-cloud]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Xcode Cloud の製品・ワークフロー・最近のビルドを読む
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/asc.p8"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$key"
          python3 - "$key" <<'PY'
          import sys, datetime
          sys.path.insert(0, 'scripts/agent')
          import appstoreconnect as asc
          api = asc.from_environment(sys.argv[1])
          def t(s):
              return datetime.datetime.fromisoformat(s.replace('Z', '+00:00')) if s else None
          def mins(a, b):
              return f"{(t(b) - t(a)).total_seconds() / 60:.1f}m" if a and b else '-'
          products = api.paginate('/v1/ciProducts?include=primaryRepositories&limit=50')
          print(f'products: {len(products)}')
          for p in products:
              a = p['attributes']
              print(f"\n== product {a.get('name')} type={a.get('productType')} created={a.get('createdDate')}")
              for w in api.paginate(f"/v1/ciProducts/{p['id']}/workflows?limit=50"):
                  wa = w['attributes']
                  print(f"   workflow '{wa.get('name')}' enabled={wa.get('isEnabled')} locked={wa.get('isLockedForEditing')}")
              runs = api.request('GET', f"/v1/ciProducts/{p['id']}/buildRuns?limit=40")['data']
              total = 0.0
              for r in runs:
                  ra = r['attributes']
                  acts = api.paginate(f"/v1/ciBuildRuns/{r['id']}/actions")
                  parts = []
                  for x in acts:
                      xa = x['attributes']
                      d = mins(xa.get('startedDate'), xa.get('finishedDate'))
                      if d != '-':
                          total += float(d[:-1])
                      parts.append(f"{xa.get('actionType')}:{xa.get('name')}={d}/{xa.get('completionStatus')}")
                  print(f"   run #{ra.get('number')} {ra.get('createdDate')} {ra.get('completionStatus')} "
                        f"wall={mins(ra.get('startedDate'), ra.get('finishedDate'))} | " + '; '.join(parts))
              print(f"   action minutes over these {len(runs)} runs: {total:.0f}")
          PY
