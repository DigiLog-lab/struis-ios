name: Probe Xcode Cloud
# Read-only: lists the Xcode Cloud products, workflows and recent build runs (with action durations)
# through the App Store Connect API, to decide which CI work can move to Xcode Cloud. Prints no secrets.
on:
  push:
    branches: [probe/xcode-cloud]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Xcode Cloud の製品・ワークフロー・最近のビルドを読む
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/asc.p8"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$key"
          python3 - "$key" <<'PY'
          import sys, datetime
          sys.path.insert(0, 'scripts/agent')
          import appstoreconnect as asc
          api = asc.from_environment(sys.argv[1])
          def t(s):
              return datetime.datetime.fromisoformat(s.replace('Z', '+00:00')) if s else None
          def mins(a, b):
              return f"{(t(b) - t(a)).total_seconds() / 60:.1f}m" if a and b else '-'
          import urllib.request, zipfile, io, re
          page = api.request('GET', '/v1/ciProducts?limit=50')
          product = [p for p in page['data'] if p['attributes'].get('name') == 'strius'][0]
          runs = api.request('GET', f"/v1/ciProducts/{product['id']}/buildRuns?limit=40&sort=-number")['data']
          stamp = re.compile(r'^(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d)')
          done = 0
          for r in runs:
              for x in api.paginate(f"/v1/ciBuildRuns/{r['id']}/actions"):
                  xa = x['attributes']
                  if xa.get('actionType') not in ('TEST', 'ARCHIVE') or xa.get('completionStatus') != 'SUCCEEDED' or done >= 3:
                      continue
                  done += 1
                  print(f"== run #{r['attributes']['number']} {xa.get('actionType')} {xa.get('name')} {xa.get('startedDate')} -> {xa.get('finishedDate')}")
                  for a in api.paginate(f"/v1/ciBuildActions/{x['id']}/artifacts"):
                      aa = a['attributes']
                      if aa.get('fileType') != 'LOG_BUNDLE' or not aa.get('downloadUrl'):
                          continue
                      z = zipfile.ZipFile(io.BytesIO(urllib.request.urlopen(aa['downloadUrl'], timeout=120).read()))
                      for name in z.namelist():
                          lines = z.read(name).decode(errors='replace').splitlines()
                          times = [m.group(1) for m in (stamp.match(l) for l in lines) if m]
                          extra = ''
                          for l in lines:
                              if re.search(r'Executed \d+ tests|BUILD SUCCEEDED|ARCHIVE SUCCEEDED|TEST BUILD SUCCEEDED|hw\.ncpu|hw\.memsize|Apple M|cores', l):
                                  extra += ' | ' + l.strip()[-120:]
                          print(f"   {name.split('/')[-1]}: {times[0] if times else '-'} -> {times[-1] if times else '-'} ({len(lines)} lines){extra[:400]}")
          PY
