name: Probe Xcode Cloud
# Read-only: lists the Xcode Cloud products, workflows and recent build runs (with action durations)
# through the App Store Connect API, to decide which CI work can move to Xcode Cloud. Prints no secrets.
on:
  push:
    branches: [probe/xcode-cloud]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Xcode Cloud の製品・ワークフロー・最近のビルドを読む
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/asc.p8"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$key"
          python3 - "$key" <<'PY'
          import sys, datetime
          sys.path.insert(0, 'scripts/agent')
          import appstoreconnect as asc
          api = asc.from_environment(sys.argv[1])
          def t(s):
              return datetime.datetime.fromisoformat(s.replace('Z', '+00:00')) if s else None
          def mins(a, b):
              return f"{(t(b) - t(a)).total_seconds() / 60:.1f}m" if a and b else '-'
          import json, urllib.request, zipfile, io, re
          page = api.request('GET', '/v1/ciProducts?limit=50')
          product = [p for p in page['data'] if p['attributes'].get('name') == 'strius'][0]
          runs = api.request('GET', f"/v1/ciProducts/{product['id']}/buildRuns?limit=40&sort=-number")['data']
          tests_done = 0
          logs_done = 0
          for r in runs:
              ra = r['attributes']
              for x in api.paginate(f"/v1/ciBuildRuns/{r['id']}/actions"):
                  xa = x['attributes']
                  if xa.get('actionType') != 'TEST' or xa.get('completionStatus') not in ('SUCCEEDED', 'FAILED'):
                      continue
                  if tests_done < 2:
                      tests_done += 1
                      results = api.paginate(f"/v1/ciBuildActions/{x['id']}/testResults?limit=200")
                      print(f"== run #{ra['number']} {xa.get('name')} {xa.get('completionStatus')}: {len(results)} test results")
                      rows = []
                      for t in results:
                          ta = t['attributes']
                          for d in ta.get('destinationTestResults') or []:
                              rows.append((d.get('duration') or 0, f"{ta.get('className')}/{ta.get('name')}", d.get('status'), d.get('deviceName'), d.get('osVersion')))
                      rows.sort(reverse=True)
                      for row in rows[:40]:
                          print(f"   {row[0]:7.1f}s {row[1]} {row[2]} {row[3]} {row[4]}")
                      print(f"   total test seconds: {sum(r[0] for r in rows):.0f} over {len(rows)} results")
                  if logs_done < 1:
                      for a in api.paginate(f"/v1/ciBuildActions/{x['id']}/artifacts"):
                          aa = a['attributes']
                          print(f"   artifact {aa.get('fileType')} {aa.get('fileName')} {aa.get('fileSize')}")
                          if aa.get('fileType') == 'LOG_BUNDLE' and aa.get('downloadUrl'):
                              logs_done += 1
                              data = urllib.request.urlopen(aa['downloadUrl'], timeout=120).read()
                              z = zipfile.ZipFile(io.BytesIO(data))
                              hits = 0
                              for name in z.namelist():
                                  if not name.endswith(('.log', '.txt')):
                                      continue
                                  text = z.read(name).decode(errors='replace')
                                  for line in text.splitlines():
                                      if re.search(r'hw\.(ncpu|memsize|model)|Hardware|Machine model|Model Identifier|Chip|Total Number of Cores|Memory:|machdep\.cpu|physical memory|CPU', line) and hits < 25:
                                          print(f"   [{name}] {line.strip()[:200]}")
                                          hits += 1
                              print(f"   log files: {len(z.namelist())}, first: {z.namelist()[:8]}")
                  if tests_done >= 2 and logs_done >= 1:
                      break
              if tests_done >= 2 and logs_done >= 1:
                  break
          PY
