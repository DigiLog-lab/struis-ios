name: Selected CI regression detection experiment
run-name: Selected CI two faults and same-VM build reuse

on:
  push:
    branches: [experiment/ci-overnight-20261022]
    paths: [.github/workflows/ci-selected-quality.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-selected-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Two concrete faults and restored baseline
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      TEST_RUNNER_STRUIS_CI_BENCH_VARIANT: optimized
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record environment
        run: |
          sudo mdutil -a -i off >/dev/null 2>&1 || true
          xcodebuild -version
          sw_vers
          sysctl hw.ncpu hw.memsize
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Restore native inputs
        id: native
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            NativeRuntime/Vendor
            NativeRuntime/PythonPackages
            NativeRuntime/PackageCache
            NativeRuntime/.build
          key: native-runtime-v1-${{ hashFiles('NativeRuntime/**', '!NativeRuntime/Shared/**', '!NativeRuntime/Worker/*.swift', '!NativeRuntime/Worker/Info.plist', '!NativeRuntime/**/*.entitlements', '!NativeRuntime/**/*.md') }}
      - name: Published outputs on cache miss
        if: steps.native.outputs.cache-hit != 'true'
        run: python3 scripts/ci/native_prebuilt.py apply
      - name: Validate measurement scripts
        run: |
          python3 -m unittest discover -s scripts/ci -p test_benchmark_selected.py
          python3 -m py_compile scripts/ci/probe_selected_quality.py
      - name: Baseline, two deliberate faults, and restored baseline
        run: python3 scripts/ci/probe_selected_quality.py
      - name: Save expected failures and full evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-selected-quality-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-selected
          if-no-files-found: error
          retention-days: 7
