name: Signing probe

# Checks which Ad Hoc provisioning steps Xcode can automate with the App Store
# Connect API key (App ID, App Group association, profiles, cloud signing).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: adhoc-archive / automatic-archive
        type: string
        default: adhoc-archive

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: プロジェクトを生成
        working-directory: scripts/agent/probe
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
      - name: 署名を試す
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          MODE: ${{ inputs.mode }}
        working-directory: scripts/agent/probe
        run: |
          set +e -uo pipefail
          umask 077
          key="$RUNNER_TEMP/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID")
          archive="$RUNNER_TEMP/probe.xcarchive"
          if [[ "$MODE" == automatic-archive ]]; then
            xcodebuild archive -project SigningProbe.xcodeproj -scheme SigningProbe -configuration Release \
              -destination generic/platform=iOS -archivePath "$archive" "${auth[@]}" > "$RUNNER_TEMP/archive.log" 2>&1
          else
            xcodebuild archive -project SigningProbe.xcodeproj -scheme SigningProbe -configuration Release \
              -destination generic/platform=iOS -archivePath "$archive" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- \
              CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES PROVISIONING_PROFILE_SPECIFIER= > "$RUNNER_TEMP/archive.log" 2>&1
          fi
          echo "archive exit: $?"
          grep -E 'error|warning: .*(profile|sign|group)|ARCHIVE' "$RUNNER_TEMP/archive.log" | tail -30
          app="$archive/Products/Applications/SigningProbe.app"
          echo "--- archive signature"
          codesign -dvv "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|Signature' || true
          codesign -d --entitlements :- "$app" 2>/dev/null | plutil -p - || true
          cat > "$RUNNER_TEMP/export.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>release-testing</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>4D4W8FMKMW</string>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$archive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" "${auth[@]}" > "$RUNNER_TEMP/export.log" 2>&1
          echo "export exit: $?"
          grep -vE '^\s*$' "$RUNNER_TEMP/export.log" | tail -80
          find "$RUNNER_TEMP" -maxdepth 2 -name '*.xcdistributionlogs' -exec sh -c 'tail -60 "$1"/IDEDistribution.standard.log' _ {} \; 2>/dev/null | tail -60
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa 2>/dev/null | head -1)
          if [[ -n "$ipa" ]]; then
            mkdir -p "$RUNNER_TEMP/ipa" && unzip -q "$ipa" -d "$RUNNER_TEMP/ipa"
            exported="$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app)"
            echo "--- exported signature"
            codesign -dvv "$exported" 2>&1 | grep -E 'Authority|TeamIdentifier' || true
            codesign -d --entitlements :- "$exported" 2>/dev/null | plutil -p - || true
            security cms -D -i "$exported/embedded.mobileprovision" > "$RUNNER_TEMP/profile.plist"
            /usr/libexec/PlistBuddy -c 'Print :Name' -c 'Print :Entitlements:com.apple.security.application-groups' "$RUNNER_TEMP/profile.plist" || true
            echo "provisioned devices: $(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profile.plist" | grep -c '^ ')"
          fi
          rm -f "$key"
