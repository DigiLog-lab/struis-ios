name: Native runtime cache

# Keeps the bootstrap output (about 50 minutes to build) in the Actions cache
# so iOS, Issue agent and prototype runs can restore it, and publishes the same
# outputs as an asset of the GitHub Release `native-runtime` so Xcode Cloud
# downloads them instead of rebuilding (scripts/ci/native_prebuilt.py).
# ios-cold.yml verifies the uncached README path separately.
on:
  workflow_dispatch:
  # Lets a token with only contents: write (re)publish the asset.
  repository_dispatch:
    types: [native-runtime]
  push:
    branches: [main]
    paths:
      - 'NativeRuntime/**'
      - '.github/workflows/agent-native-cache.yml'

permissions:
  # write: create the `native-runtime` release and upload its asset.
  contents: write

concurrency:
  group: native-runtime-cache
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: cache keyを計算
        id: key
        run: echo "key=native-runtime-v1-${{ hashFiles('NativeRuntime/**', '!NativeRuntime/Shared/**', '!NativeRuntime/Worker/*.swift', '!NativeRuntime/Worker/Info.plist', '!NativeRuntime/**/*.entitlements', '!NativeRuntime/**/*.md') }}" >> "$GITHUB_OUTPUT"
      - name: 既存cacheを確認
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            NativeRuntime/Vendor
            NativeRuntime/PythonPackages
            NativeRuntime/PackageCache
            NativeRuntime/.build
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.lookup.outputs.cache-hit != 'true'
        with:
          python-version: '3.14'
      - name: ツールを準備
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          brew install autoconf automake libtool
          if ! command -v rustup >/dev/null; then
            brew install rustup
          fi
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 aarch64-apple-ios aarch64-apple-ios-sim
      - name: 固定依存を生成
        if: steps.lookup.outputs.cache-hit != 'true'
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          python3.14 NativeRuntime/Scripts/bootstrap.py --platform both
          rm -rf NativeRuntime/.build/codex NativeRuntime/.build/codex-artifacts
      - name: cacheを保存
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            NativeRuntime/Vendor
            NativeRuntime/PythonPackages
            NativeRuntime/PackageCache
            NativeRuntime/.build
          key: ${{ steps.key.outputs.key }}
      - name: 公開済みのXcode Cloud用assetを確認
        id: published
        run: |
          set -euo pipefail
          key="$(python3 scripts/ci/native_prebuilt.py key)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/native-runtime/native-runtime-${key}.tar.gz.sha256"
          if curl -fsSIL -o /dev/null "$url"; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: 既存cacheを展開
        if: steps.lookup.outputs.cache-hit == 'true' && steps.published.outputs.exists != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            NativeRuntime/Vendor
            NativeRuntime/PythonPackages
            NativeRuntime/PackageCache
            NativeRuntime/.build
          key: ${{ steps.key.outputs.key }}
          fail-on-cache-miss: true
      - name: Xcode Cloud用にnative生成物を公開
        if: steps.published.outputs.exists != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEY: ${{ steps.published.outputs.key }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/native-runtime-$KEY.tar.gz"
          python3 scripts/ci/native_prebuilt.py pack "$archive"
          python3 scripts/ci/publish_native.py "$archive"
