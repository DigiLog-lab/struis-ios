name: iOS
run-name: >-
  ${{ github.event_name == 'repository_dispatch' && format('Verify PR #{0} {1}', github.event.client_payload.pr, github.event.client_payload.sha) || 'iOS' }}

on:
  # The verification of a PR: `agentctl ready` (or the web Claude after a direct fix) sends the PR's exact
  # HEAD. It runs main's definition of this file on that commit; its last job calls agent.yml's `report`,
  # which writes the commit status `Struis / verify` and wakes the Issue when it is red.
  repository_dispatch:
    types: [verify]
  # Manual runs: on main, every UI test, then `signed-archive` and the optional TestFlight upload; on any
  # other branch, the same checks as a PR verification (or every UI test with ui_tier=full).
  workflow_dispatch:
    inputs:
      ui_tier:
        description: UIテストの範囲(pr = 変更に関係する分、full = 全件)
        type: choice
        options: [pr, full]
        default: pr
      upload:
        description: App Store Connectへアップロードする
        type: boolean
        default: false
      build_number:
        description: アップロード時の新しいbuild番号
        type: string
        required: false

permissions:
  contents: read

concurrency:
  # Verifications of one PR run one after another (each is a different commit); main's manual release runs alone.
  group: ${{ github.event_name == 'repository_dispatch' && format('ios-verify-{0}', github.event.client_payload.pr) || format('ios-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  # A run started by repository_dispatch belongs to main, so GitHub shows nothing of it on the PR. Mark the
  # verified commit `Struis / verify: pending` first, so the PR shows the verification in progress (and not
  # "ready to merge"); `report` overwrites it with the result. No checkout: the PR's code never runs here.
  pending:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: 検証中であることをPRのcommitに付ける
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.client_payload.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full commit SHA"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context='Struis / verify' \
            -f target_url="$RUN_URL" -f description='ios.yml: 検証中' --silent

  # Builds the Native Runtime cache for this commit if it is missing (agent-native-cache.yml is the only
  # builder), so the build and UI test runners below can start in parallel and only restore it.
  native:
    uses: ./.github/workflows/agent-native-cache.yml
    with:
      ref: ${{ github.event.client_payload.sha || github.sha }}

  # Manual full runs only (a release from main, or ui_tier=full): a PR verification is `verify`.
  build:
    needs: [native, ui-plan]
    # An upload run skips the UI tests: the merged PRs were verified, and signed-archive builds the app itself.
    if: needs.ui-plan.outputs.tier == 'full' && !inputs.upload
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.client_payload.sha || github.sha }}
      - name: Spotlight の索引を止める
        # The runner VM has 3 CPUs and 7 GB; Xcode, the Simulator and the app already fill the memory, and a
        # stackshot of a 2-minute stall showed Spotlight (mds_stores) indexing while pages were read back in.
        run: |
          sudo mdutil -a -i off >/dev/null 2>&1 || true
          echo "memory: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB, cpus: $(sysctl -n hw.ncpu)"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Xcodeを確認
        run: xcodebuild -version
      - name: Native Runtime cacheを復元
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            NativeRuntime/Vendor
            NativeRuntime/PythonPackages
            NativeRuntime/PackageCache
            NativeRuntime/.build
          key: native-runtime-v1-${{ hashFiles('NativeRuntime/**', '!NativeRuntime/Shared/**', '!NativeRuntime/Worker/*.swift', '!NativeRuntime/Worker/Info.plist', '!NativeRuntime/**/*.entitlements', '!NativeRuntime/**/*.md') }}
          fail-on-cache-miss: true
      - name: READMEのSimulatorビルド
        timeout-minutes: 30
        run: |
          set -euo pipefail
          xcodebuild build -project strius.xcodeproj -scheme strius \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 CODE_SIGNING_ALLOWED=NO
      - name: Simulatorで単体テスト
        timeout-minutes: 30
        run: |
          set -euo pipefail
          xcodebuild test -project strius.xcodeproj -scheme strius \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -resultBundlePath "$RUNNER_TEMP/StruisTests.xcresult" \
            -collect-test-diagnostics never \
            -only-testing:striusTests -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 300 ARCHS=arm64 STRUIS_AUTH_REQUIRED=YES
      - name: 実機向けRelease archiveを検証
        if: github.ref != 'refs/heads/main'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          xcodebuild archive -project strius.xcodeproj -scheme strius \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StruisPR.xcarchive" CODE_SIGNING_ALLOWED=NO
      - name: テスト結果を保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore

  # Decides the tier and the UI tests (scripts/ci/ui_test_plan.py, scripts/ci/ui-test-plan.json).
  # A PR verification and a manual run on another branch run the `pr` tier in the single `verify` job:
  # every unit test plus the UI tests of the contracts the change touches (possibly none).
  # A manual run on main and a manual `full` run every UI test across runners (`build` + `ui-tests`).
  ui-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      matrix: ${{ steps.plan.outputs.matrix }}
      ui: ${{ steps.plan.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.client_payload.sha || github.sha }}
          fetch-depth: 0
      - name: 実行するUIテストを決める
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REQUESTED_TIER: ${{ inputs.ui_tier }}
        run: |
          set -euo pipefail
          # Manual main runs (release) get every UI test.
          if [[ "$EVENT" == "workflow_dispatch" && ( "$REQUESTED_TIER" == "full" || "$REF" == "refs/heads/main" ) ]]; then
            echo "tier=full" >> "$GITHUB_OUTPUT"
            matrix=$(python3 scripts/ci/ui_test_plan.py --matrix)
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            echo "ui=" >> "$GITHUB_OUTPUT"
            echo "### UIテスト: 全件 ($(python3 -c 'import json,sys; print(sum(i["count"] for i in json.loads(sys.argv[1])))' "$matrix")件)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "tier=pr" >> "$GITHUB_OUTPUT"
          echo "matrix=[]" >> "$GITHUB_OUTPUT"
          args=()
          if git rev-parse --verify --quiet origin/main >/dev/null; then
            git diff --name-only --no-renames "origin/main...HEAD" > "$RUNNER_TEMP/changed.txt"
            git diff -U0 --no-renames "origin/main...HEAD" -- strius.xcodeproj/project.pbxproj > "$RUNNER_TEMP/project.diff"
            args=(--changed-files "$RUNNER_TEMP/changed.txt" --project-diff "$RUNNER_TEMP/project.diff")
          else
            # No base to compare with: every contract (never fewer tests than the change needs).
            args=(--no-diff)
          fi
          python3 scripts/ci/ui_test_plan.py --list "${args[@]}" > "$RUNNER_TEMP/selection.json"
          ui=$(python3 -c 'import json,sys; print(" ".join("-only-testing:striusUITests/" + t for t in json.load(open(sys.argv[1]))["uiTests"]))' "$RUNNER_TEMP/selection.json")
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          python3 - "$RUNNER_TEMP/selection.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          selection = json.load(open(sys.argv[1]))
          print(f"### UIテスト: {len(selection['uiTests'])}件 (単体テストは全部)\n")
          for reason, paths in sorted(selection['reasons'].items()):
              print(f"- {reason}: " + ", ".join(f"`{path}`" for path in paths[:5]) + (" ほか" if len(paths) > 5 else ""))
          for test in selection['uiTests']:
              print(f"  - {test}")
          PY

  # The PR verification: one build, then the unit tests, then the selected UI tests, on one
  # booted Simulator. The unit tests run first in their own xcodebuild invocation, so a failing unit test
  # stops the job within minutes instead of being reported after every UI test (2026-10-31: a unit test
  # that failed in the first 5 minutes was reported after 17). The Release archive runs at the same time
  # on another runner (`release-archive`), so it no longer adds about 15 minutes after the tests.
  verify:
    needs: [native, ui-plan]
    if: needs.ui-plan.outputs.tier == 'pr'
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.client_payload.sha || github.sha }}
      - name: Spotlight の索引を止める
        # The runner VM has 3 CPUs and 7 GB; Xcode, the Simulator and the app already fill the memory, and a
        # stackshot of a 2-minute stall showed Spotlight (mds_stores) indexing while pages were read back in.
        run: |
          sudo mdutil -a -i off >/dev/null 2>&1 || true
          echo "memory: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB, cpus: $(sysctl -n hw.ncpu)"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Native Runtime cacheを復元
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            NativeRuntime/Vendor
            NativeRuntime/PythonPackages
            NativeRuntime/PackageCache
            NativeRuntime/.build
          key: native-runtime-v1-${{ hashFiles('NativeRuntime/**', '!NativeRuntime/Shared/**', '!NativeRuntime/Worker/*.swift', '!NativeRuntime/Worker/Info.plist', '!NativeRuntime/**/*.entitlements', '!NativeRuntime/**/*.md') }}
          fail-on-cache-miss: true
      - name: テスト用にビルドし、Simulatorを起動する
        # Tests run signed (no CODE_SIGNING_ALLOWED=NO): an unsigned run failed
        # ClaudeAppAttestTests/testReinstalledDeviceRegistersANewKeyWhenTheStoredKeyIsUnusable (2026-10-22).
        timeout-minutes: 40
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((key for key in runtimes if ".iOS-" in key),
                       key=lambda key: [int(part) for part in key.rsplit(".iOS-", 1)[1].split("-")])
          for key in reversed(ios):
              for device in runtimes[key]:
                  if device["name"] == "iPhone 17":
                      print(device["udid"]); sys.exit()
          sys.exit("iPhone 17 simulator not found")')
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcodebuild build-for-testing -project strius.xcodeproj -scheme strius \
            -destination "id=$udid" -derivedDataPath "$RUNNER_TEMP/DerivedData" ARCHS=arm64 STRUIS_AUTH_REQUIRED=YES
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
      - name: 単体テストを流す(落ちたらここで止め、UIテストは流さない)
        run: |
          set -euo pipefail
          xcodebuild test-without-building -project strius.xcodeproj -scheme strius \
            -destination "id=$SIMULATOR_UDID" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/StruisGateUnit.xcresult" \
            -collect-test-diagnostics never -only-testing:striusTests \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 600 \
            -parallel-testing-enabled NO ARCHS=arm64 STRUIS_AUTH_REQUIRED=YES
      - name: 選んだUIテストを流す
        if: needs.ui-plan.outputs.ui != ''
        env:
          UI_TESTS: ${{ needs.ui-plan.outputs.ui }}
        run: |
          set -euo pipefail
          read -r -a ui <<< "$UI_TESTS"
          echo "UI tests: ${#ui[@]}"
          xcodebuild test-without-building -project strius.xcodeproj -scheme strius \
            -destination "id=$SIMULATOR_UDID" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/StruisGateUI.xcresult" \
            -collect-test-diagnostics never "${ui[@]}" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 600 \
            -parallel-testing-enabled NO ARCHS=arm64 STRUIS_AUTH_REQUIRED=YES \
            TEST_RUNNER_STRUIS_PROBE_DIR="$RUNNER_TEMP/ui-probe"
      - name: メモリの様子を記録
        if: always()
        run: |
          sysctl vm.swapusage || true
          vm_stat | grep -E 'Pages (free|active|wired down|occupied by compressor)|Swapins|Swapouts' || true
      - name: テスト結果を保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/*.xcresult
            ${{ runner.temp }}/ui-probe
          if-no-files-found: ignore

  # The Release archive check of the `pr` tier, on its own runner at the same time as `verify` (it used to run
  # after the tests in `verify`). A failure here fails the run like a failed test.
  release-archive:
    needs: [native, ui-plan]
    if: needs.ui-plan.outputs.tier == 'pr' && (github.event_name == 'repository_dispatch' || github.ref != 'refs/heads/main')
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.client_payload.sha || github.sha }}
      - name: Spotlight の索引を止める
        run: sudo mdutil -a -i off >/dev/null 2>&1 || true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Native Runtime cacheを復元
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            NativeRuntime/Vendor
            NativeRuntime/PythonPackages
            NativeRuntime/PackageCache
            NativeRuntime/.build
          key: native-runtime-v1-${{ hashFiles('NativeRuntime/**', '!NativeRuntime/Shared/**', '!NativeRuntime/Worker/*.swift', '!NativeRuntime/Worker/Info.plist', '!NativeRuntime/**/*.entitlements', '!NativeRuntime/**/*.md') }}
          fail-on-cache-miss: true
      - name: 実機向けRelease archiveを検証
        timeout-minutes: 30
        run: |
          set -euo pipefail
          xcodebuild archive -project strius.xcodeproj -scheme strius \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StruisPR.xcarchive" CODE_SIGNING_ALLOWED=NO

  ui-tests:
    needs: [native, ui-plan]
    if: needs.ui-plan.outputs.tier == 'full' && needs.ui-plan.outputs.matrix != '[]' && !inputs.upload
    name: UIテスト (${{ matrix.shard }})
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ui-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.client_payload.sha || github.sha }}
      - name: Spotlight の索引を止める
        # The runner VM has 3 CPUs and 7 GB; Xcode, the Simulator and the app already fill the memory, and a
        # stackshot of a 2-minute stall showed Spotlight (mds_stores) indexing while pages were read back in.
        run: |
          sudo mdutil -a -i off >/dev/null 2>&1 || true
          echo "memory: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB, cpus: $(sysctl -n hw.ncpu)"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Native Runtime cacheを復元
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            NativeRuntime/Vendor
            NativeRuntime/PythonPackages
            NativeRuntime/PackageCache
            NativeRuntime/.build
          key: native-runtime-v1-${{ hashFiles('NativeRuntime/**', '!NativeRuntime/Shared/**', '!NativeRuntime/Worker/*.swift', '!NativeRuntime/Worker/Info.plist', '!NativeRuntime/**/*.entitlements', '!NativeRuntime/**/*.md') }}
          fail-on-cache-miss: true
      - name: UIテスト用にビルドし、Simulatorを温める
        # On a fresh runner the app's first launch takes 40 s or more (once over 3 minutes), which
        # used to land inside the first test's time allowance. Boot, install and launch once here.
        timeout-minutes: 40
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -project strius.xcodeproj -scheme strius \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" ARCHS=arm64 STRUIS_AUTH_REQUIRED=YES
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((key for key in runtimes if ".iOS-" in key),
                       key=lambda key: [int(part) for part in key.rsplit(".iOS-", 1)[1].split("-")])
          for key in reversed(ios):
              for device in runtimes[key]:
                  if device["name"] == "iPhone 17":
                      print(device["udid"]); sys.exit()
          sys.exit("iPhone 17 simulator not found")')
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/strius.app"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl install "$udid" "$app"
          started=$(date +%s)
          xcrun simctl launch "$udid" "$bundle"
          # Wait until the app has actually initialized: LearnerData creates the learner data folder
          # (Application Support/Struis) while the app starts. Up to 4 minutes (the slowest observed launch
          # was over 3), then a few seconds more for the first screen.
          data=$(xcrun simctl get_app_container "$udid" "$bundle" data)
          ready=""
          for _ in $(seq 1 240); do
            if [ -d "$data/Library/Application Support/Struis" ]; then ready=yes; break; fi
            sleep 1
          done
          sleep 5
          xcrun simctl terminate "$udid" "$bundle" || true
          if [ -n "$ready" ]; then
            echo "Warm-up launch of $bundle on $udid was ready after $(( $(date +%s) - started ))s"
          else
            echo "::warning::Warm-up launch of $bundle did not create its data folder within 240s"
          fi
      - name: SimulatorでUIテスト
        env:
          TESTS: ${{ matrix.tests }}
        run: |
          set -euo pipefail
          # One -only-testing argument per selected test; an empty list never reaches here.
          read -r -a only <<< "$TESTS"
          if (( ${#only[@]} == 0 )); then
            echo 'No UI tests assigned to this runner.' >&2
            exit 1
          fi
          xcodebuild test-without-building -project strius.xcodeproj -scheme strius \
            -destination "id=$SIMULATOR_UDID" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/StruisUITests.xcresult" \
            -collect-test-diagnostics never "${only[@]}" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 600 \
            -parallel-testing-enabled NO ARCHS=arm64 STRUIS_AUTH_REQUIRED=YES \
            TEST_RUNNER_STRUIS_PROBE_DIR="$RUNNER_TEMP/ui-probe"
      - name: メモリの様子を記録
        # Intermittent UI-test stalls coincide with memory pressure; keep the numbers next to each run.
        if: always()
        run: |
          sysctl vm.swapusage || true
          vm_stat | grep -E 'Pages (free|active|wired down|occupied by compressor)|Swapins|Swapouts' || true
      - name: テスト結果を保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-ui-test-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/*.xcresult
            ${{ runner.temp }}/ui-probe
          if-no-files-found: ignore

  signed-archive:
    needs: [build, ui-plan, ui-tests]
    # main only (a manual release/upload run). Without upload, after the build job and every UI test runner passed;
    # with upload, straight away (the UI tests are skipped, see `build`).
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' &&
      needs.ui-plan.result == 'success' &&
      (inputs.upload || (needs.build.result == 'success' && needs.ui-tests.result == 'success'))
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.client_payload.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      # A distributed build never uses the Actions cache: the agent worker runs on
      # main's cache scope and can obtain the runner's cache credentials, so the
      # native runtime is built here from the checked-out source (as Xcode Cloud
      # Release does).
      - name: ツールを準備
        run: |
          set -euo pipefail
          brew install autoconf automake libtool
          if ! command -v rustup >/dev/null; then
            brew install rustup
          fi
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 aarch64-apple-ios
      - name: 固定依存をソースから生成
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          python3.14 NativeRuntime/Scripts/bootstrap.py --platform device
      - name: 署名付きarchiveを作成
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_APP_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_APP_BASE64 }}
          BUILD_PROVISION_PROFILE_RUNTIME_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_RUNTIME_BASE64 }}
          BUILD_PROVISION_PROFILE_EXEC_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_EXEC_BASE64 }}
          STRUIS_DELIVERY_APP_KEY: ${{ secrets.STRUIS_DELIVERY_APP_KEY }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          UPLOAD: ${{ inputs.upload }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          args=(--output "$RUNNER_TEMP/StruisArchive")
          if [[ "$UPLOAD" == "true" ]]; then
            args+=(--upload --build-number "$BUILD_NUMBER")
          fi
          python scripts/ci_archive.py "${args[@]}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          record = json.loads((Path(os.environ['RUNNER_TEMP']) / 'StruisArchive/provenance.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('### Archive\n\n')
              for key, value in record.items():
                  stream.write(f'- {key}: `{value}`\n')
          PY

  # The result of a PR verification goes back through agent.yml (the store accepts only that workflow).
  # Called here because a run started by the agent's GITHUB_TOKEN never triggers a workflow_run.
  # GitHub checks these against every job of agent.yml, including the ones that do not run when it is called
  # (worker: pull-requests write, cleanup: actions write), so this is the ceiling of all of them. Only
  # agent.yml's `report` job runs, with its own narrower permissions; the PR's code never runs in this job.
  report:
    needs: [native, ui-plan, verify, release-archive]
    if: always() && github.event_name == 'repository_dispatch'
    permissions:
      contents: write
      statuses: write
      issues: write
      pull-requests: write
      actions: write
      id-token: write
    uses: ./.github/workflows/agent.yml
    with:
      verify_conclusion: >-
        ${{ needs.verify.result == 'success' && needs.release-archive.result == 'success' && 'success' ||
            contains(needs.*.result, 'cancelled') && 'cancelled' || 'failure' }}
