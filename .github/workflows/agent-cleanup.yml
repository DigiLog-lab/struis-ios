name: Agent checkpoint cleanup

on:
  issues:
    types: [closed]
  pull_request_target:
    types: [closed]
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: write
  id-token: write

concurrency:
  group: agent-checkpoint-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/agent
      - name: 閉じたIssue・PRの保存物を削除
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_STORE_URL: ${{ vars.AGENT_STORE_URL || 'https://agent-struis.digiloglab.com' }}
        run: python3 scripts/agent/cleanup.py
      - name: チェックポイントだけのR2 lifecycleを照合
        if: vars.AGENT_R2_LIFECYCLE_ENABLED == 'true'
        env:
          AGENT_STORE_URL: ${{ vars.AGENT_STORE_URL || 'https://agent-struis.digiloglab.com' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.AGENT_R2_LIFECYCLE_API_TOKEN }}
          AGENT_CHECKPOINT_RETENTION_DAYS: ${{ vars.AGENT_CHECKPOINT_RETENTION_DAYS || '14' }}
        run: python3 scripts/agent/lifecycle.py --apply
