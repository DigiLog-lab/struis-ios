name: Agent tests
run-name: ${{ inputs.ci_request && format('Agent tests CI {0}', inputs.ci_request) || 'Agent tests' }}

on:
  workflow_dispatch:
    inputs:
      ci_request:
        description: エージェントのCI要求識別子
        type: string
        required: false
  push:
    branches: [main, 'release/**']
    paths:
      - '.github/actionlint.yaml'
      - 'scripts/agent/**'
      - 'cloudflare/agent/**'
      - '.github/workflows/agent*.yml'
  pull_request:
    paths:
      - '.github/actionlint.yaml'
      - 'scripts/agent/**'
      - 'cloudflare/agent/**'
      - '.github/workflows/agent*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 制御スクリプトの単体テスト
        run: python3 -m unittest discover -s scripts/agent/tests -v
      - name: Actions定義の構文と式を検証
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, os, tarfile, urllib.request
          url = 'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz'
          data = urllib.request.urlopen(url, timeout=60).read()
          expected = '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          if hashlib.sha256(data).hexdigest() != expected:
              raise RuntimeError('actionlint checksum mismatch')
          with tarfile.open(fileobj=io.BytesIO(data)) as archive:
              archive.extract('actionlint', os.environ['RUNNER_TEMP'], filter='data')
          PY
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Workerの構文確認
        run: node --check cloudflare/agent/src/index.js
