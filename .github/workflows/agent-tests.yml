name: Agent tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/agent/**'
      - 'cloudflare/agent/**'
      - '.github/workflows/agent*.yml'
  pull_request:
    paths:
      - 'scripts/agent/**'
      - 'cloudflare/agent/**'
      - '.github/workflows/agent*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 制御スクリプトの単体テスト
        run: python3 -m unittest discover -s scripts/agent/tests -v
      - name: Workerの構文確認
        run: node --check cloudflare/agent/src/index.js
