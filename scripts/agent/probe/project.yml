name: SigningProbe
options:
  deploymentTarget:
    iOS: "18.0"
targets:
  SigningProbe:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Signing Probe
        UILaunchScreen: {}
    entitlements:
      path: Sources/SigningProbe.entitlements
      properties:
        com.apple.security.application-groups:
          - $(PROBE_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PROBE_BUNDLE_ID)
        PROBE_BUNDLE_ID: com.digiloglab.strius.preview.i2.a
        PROBE_APP_GROUP: group.com.digiloglab.strius.preview.i2.a
        DEVELOPMENT_TEAM: 4D4W8FMKMW
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
